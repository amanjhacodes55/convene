<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&display=block" />
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(ellipse at 30% 35%, #1f2250 0%, #12131f 55%, #0b0d12 100%);
    color: #eef0f6; font-family: "Geist", sans-serif;
  }
  .wrap { text-align: center; }
  .wrap > * { opacity: 0; transform: translateY(14px); transition: opacity .8s ease, transform .8s ease; }
  body.in .wrap > * { opacity: 1; transform: none; }
  body.in .wrap > :nth-child(2) { transition-delay: .15s; }
  body.in .wrap > :nth-child(3) { transition-delay: .35s; }
  body.in .wrap > :nth-child(4) { transition-delay: .55s; }
  .brand { display: inline-flex; align-items: center; gap: 22px; }
  .brand svg { width: 88px; height: 88px; }
  h1 { margin: 0; font: 600 88px/1 "Geist", sans-serif; letter-spacing: -2.5px; }
  .tag { margin: 26px 0 0; font-size: 30px; font-weight: 500; color: #b4b9c8; }
  .rule { width: 90px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #6d7cff, #8f6dff); margin: 30px auto; }
  .links { font-size: 22px; line-height: 1.8; color: #9aa0b2; }
  .links b { color: #fff; font-weight: 500; font-family: "Geist Mono", monospace; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d7cff"/><stop offset="1" stop-color="#8f6dff"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#g)"/><rect x="6" y="10" width="14" height="12" rx="3.5" fill="#fff"/><path d="M21.5 14.2 26 11.5v9l-4.5-2.7z" fill="#fff"/><circle cx="13" cy="16" r="2.4" fill="#7a74ff"/></svg>
      <h1>Convene</h1>
    </div>
    <p class="tag">Open-source video meetings and developer platform · MIT</p>
    <div class="rule"></div>
    <div class="links">
      <div><b>github.com/amanjhacodes55/convene</b></div>
      <div>{{LIVE}}</div>
    </div>
  </div>
</body>
</html>
