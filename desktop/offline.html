<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Convene</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d12; color: #eef0f6; text-align: center; }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
      p { margin: 0; color: #b4b9c8; }
      button { margin-top: 22px; height: 40px; padding: 0 18px; border: 0; border-radius: 12px; background: linear-gradient(135deg, #6d7cff, #8f6dff); color: white; font-size: 15px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div>
      <h1>Can't reach Convene</h1>
      <p>Check your internet connection, then try again.</p>
      <button id="retry">Try again</button>
    </div>
    <script>
      const target = new URLSearchParams(location.search).get("url");
      document.getElementById("retry").onclick = () => target && /^https?:/.test(target) && location.replace(target);
    </script>
  </body>
</html>
